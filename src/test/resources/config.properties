# Mobile Test Automation App - Configuration
# This file contains all configuration properties for the test automation framework

# ============ ENVIRONMENT ============
environment=staging
platform=android

# ============ APPLICATION ============
app.name=TestApp
app.path=/path/to/app.apk
app.version=1.0.0

# ============ APPIUM SERVER ============
appium.server.url=http://localhost
appium.server.port=4723
appium.start.retry=3
appium.start.timeout=30000
appium.command.timeout=60000

# ============ ANDROID CAPABILITIES ============
android.device.name=emulator-5554
android.platform.version=12
android.app.package=com.example.testapp
android.app.activity=.splash.SplashActivity
android.automation.name=UiAutomator2
android.no.reset=false
android.full.reset=true

# ============ iOS CAPABILITIES ============
ios.device.name=iPhone Simulator
ios.platform.version=16.0
ios.automation.name=XCUITest
ios.bundle.id=com.example.testapp

# ============ WAIT CONFIGURATIONS ============
implicit.wait.seconds=10
explicit.wait.seconds=15
polling.interval.ms=500

# ============ SCREENSHOT CONFIGURATION ============
screenshot.on.failure=true
screenshot.path=target/screenshots
screenshot.format=png

# ============ JIRA INTEGRATION (OPTIONAL) ============
jira.enabled=false
jira.url=https://your-jira.atlassian.net
jira.user=user@example.com
jira.token=your_api_token
jira.project.key=PROJ
jira.max.retry=2

# ============ LOGGING ============
log.level=INFO
log.file.path=target/logs
log.file.name=test-automation.log

# ============ REPORT CONFIGURATION ============
allure.enabled=true
allure.results.path=target/allure-results

# ============ PARALLEL EXECUTION ============
parallel.classes=false
parallel.methods=false
parallel.threads=1

